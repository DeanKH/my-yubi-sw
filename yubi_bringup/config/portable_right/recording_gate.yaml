# Portable (right hand only) — overlay onto common/recording_gate.yaml
# Adds head camera (USB cam @ ~60 Hz) conditions (same as portable) and
# removes every gate condition that watches the absent LEFT hand
# (`key: null` deletes the key during merge) — otherwise the missing
# topics would immediately trigger warn/HARD_STOP and block recording.
# The TF frames list is replaced with the right hand only.

groups:
  health:
    conditions:
      # Head camera (USB): topic stopped → warn at 1s, stop at 3s
      head_camera_timeout_warn:
        topic: /center_camera/camera_info
        timeout_sec: 1.0
        escalation: 1

      head_camera_timeout_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        escalation: 2

      # Head camera: < 30 Hz → warning (BLOCK_START), < 15 Hz → stop (HARD_STOP)
      head_camera_warn:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 30.0
        rate_window_sec: 5.0
        rate_escalation: 1
        debounce_sec: 0.5
        reason: "Center (USB) camera frame rate below 30 Hz ({detail})"

      head_camera_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 15.0
        rate_window_sec: 5.0
        rate_escalation: 2
        debounce_sec: 0.5
        reason: "Center (USB) camera frame rate below 15 Hz ({detail})"

      # Left hand absent on this rig — drop its camera/gripper conditions.
      left_camera_timeout_warn: null
      left_camera_timeout_stop: null
      left_camera_warn: null
      left_camera_stop: null
      left_gripper_joint_state_timeout_stop: null

  tf:
    conditions:
      quest_hands_warn:
        frames:
          - source: "quest_origin"
            target: "right_hand_root"
            max_age_sec: 1.0

      quest_hands_stop:
        frames:
          - source: "quest_origin"
            target: "right_hand_root"
            max_age_sec: 5.0

  vr_tracking:
    conditions:
      # Left controller tracking is not required on a right-hand-only rig.
      left_tracked_warn: null
      left_tracked_stop: null
      left_valid_warn: null
      left_valid_stop: null
