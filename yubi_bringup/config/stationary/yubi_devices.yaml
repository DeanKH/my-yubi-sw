# Stationary (yagura) — overlay onto common/yubi_devices.yaml
# Adds: hand cameras (left/right), footpedal_node (presence marker),
# task_command_dispatch_node (footpedal button mapping), /camera/camera
# (RealSense head camera).

left_camera/usb_cam:
  ros__parameters:
    video_device: "/dev/yubi_left_camera"
    framerate: 120.0
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    camera_name: "left_camera"
    frame_id: "left_camera_optical_frame"
    controls:
      brightness: 50
      white_balance_automatic: true
      auto_exposure: 3

right_camera/usb_cam:
  ros__parameters:
    video_device: "/dev/yubi_right_camera"
    framerate: 120.0
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    camera_name: "right_camera"
    frame_id: "right_camera_optical_frame"
    controls:
      brightness: 50
      white_balance_automatic: true
      auto_exposure: 3

footpedal_node:
  ros__parameters: {}

task_command_dispatch_node:
  ros__parameters:
    joy_accept_button: 2
    joy_reject_button: 1
    joy_cancel_episode_button: 0
    joy_rewind_button: -1

/camera/camera:
  ros__parameters:
    enable_color: true
    rgb_camera.color_profile: "640x480x30"
    enable_depth: false
    align_depth.enable: false
    enable_sync: true
    publish_tf: true
    tf_publish_rate: 1.0
